components:
  schemas:
    Ban:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reason:
          type: string
          nullable: true
        banned_start:
          type: string
          format: date-time
          readOnly: true
        banned_end:
          type: string
          format: date-time
        is_banned:
          type: boolean
        user:
          type: integer
        banned_by:
          type: integer
      required:
      - banned_by
      - banned_end
      - banned_start
      - id
      - user
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        message:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/MessageFile'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - files
      - id
      - message
      - updated_at
      - user
      - username
    ContentTypeEnum:
      enum:
      - video
      - audio
      - document
      - youtube
      type: string
      description: |-
        * `video` - Video
        * `audio` - Audio
        * `document` - Document
        * `youtube` - Youtube
    MainSection:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        order_index:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          nullable: true
      required:
      - created_at
      - id
      - name
    MessageFile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        message:
          type: integer
          readOnly: true
          nullable: true
        file:
          type: string
          format: uri
        user:
          type: integer
          readOnly: true
      required:
      - file
      - id
      - message
      - user
    Metadata:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 512
        content_type:
          $ref: '#/components/schemas/ContentTypeEnum'
        description:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        subsection:
          type: integer
        secondary_subsection:
          type: integer
          nullable: true
        created_by:
          type: integer
          readOnly: true
      required:
      - content_type
      - created_at
      - created_by
      - id
      - subsection
      - title
      - updated_at
    Moderator:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - id
      - password
      - username
    PaginatedBanList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Ban'
    PaginatedChatMessageList:
